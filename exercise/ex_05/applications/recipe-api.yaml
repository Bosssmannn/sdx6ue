apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Bosssmannn/sdx6ue.git
    targetRevision: main
    path: exercise/ex_05/recipe-chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: dbUser
          value: "recipe_user"
        - name: dbPassword
          value: "CHANGE_ME_USE_SEALED_SECRETS"
        # ---- Demo overrides: swap to working public images ----
        # The Exercise 4 chart references vstadtmueller/recipe-api which is
        # not published publicly. For the GitOps demo, we override to a real
        # public image. The chart itself is unmodified.
        - name: image.repository
          value: "paulbouwer/hello-kubernetes"
        - name: image.tag
          value: "1.10.1"
        - name: image.pullPolicy
          value: "IfNotPresent"
        - name: postgresql.enabled
          value: "false"
        - name: securityContext.readOnlyRootFilesystem
          value: "false"
      values: |
        # Override liveness/readiness probes to TCP (http-echo has no /health endpoint)
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
  destination:
    server: https://kubernetes.default.svc
    namespace: recipe-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
