apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Enable local accounts for RBAC testing
  accounts.admin-user: apiKey, login
  accounts.dev-user: apiKey, login

  # Resource tracking method
  application.resourceTrackingMethod: annotation

  # NOTE: We do NOT exclude Secrets globally here, because that would
  # prevent ArgoCD from CREATING Secrets defined in Helm charts.
  # Instead, sensitive-resource protection is handled per-Application via
  # `ignoreDifferences` (see applications/recipe-api.yaml) so manual edits
  # to Secret /data are not flagged as drift.
