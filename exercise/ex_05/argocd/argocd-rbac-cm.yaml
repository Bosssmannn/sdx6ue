apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Default policy: no access unless explicitly granted
  policy.default: role:readonly

  policy.csv: |
    # ──────────────────────────────────────────────────────
    # Admin role — full access to everything
    # ──────────────────────────────────────────────────────
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, certificates, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, gpgkeys, *, *, allow
    p, role:admin, logs, *, *, allow
    p, role:admin, exec, *, *, allow

    # ──────────────────────────────────────────────────────
    # Developer role — can view and sync apps, but CANNOT
    # delete apps, modify ArgoCD settings, or manage repos
    # ──────────────────────────────────────────────────────
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, action/*, */*, allow
    p, role:developer, logs, get, *, allow

    # ──────────────────────────────────────────────────────
    # Role bindings — assign users to roles
    # ──────────────────────────────────────────────────────
    g, admin-user, role:admin
    g, dev-user, role:developer
