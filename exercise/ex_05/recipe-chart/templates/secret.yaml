apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recipe-api.fullname" . }}-db-credentials
  labels:
    {{- include "recipe-api.labels" . | nindent 4 }}
type: Opaque
data:
  # Values are base64-encoded at render time by Helm's b64enc function.
  # The raw values must be supplied via --set or an external secret manager,
  # never committed to Git as plaintext.
  DB_USER: {{ required "dbUser is required" .Values.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ required "dbPassword is required" .Values.dbPassword | b64enc | quote }}
